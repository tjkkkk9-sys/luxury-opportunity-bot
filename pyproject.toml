[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxury-opportunity-bot"
version = "0.1.0"
description = "Calcolo e notifica di opportunità nel mercato del lusso"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
